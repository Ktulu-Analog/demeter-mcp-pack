[package]
name = "mcp-legifrance"
version = "0.2.1"
edition = "2021"
description = "Serveur MCP HTTP Streamable pour l'API Légifrance (PISTE) — écrit en Rust"
license = "AGPL-3.0"

[[bin]]
name = "mcp-legifrance"
path = "src/main.rs"

[dependencies]
axum = "=0.7.5"
tokio = { version = "=1.36.0", features = ["full"] }
tower-http = { version = "=0.5.2", features = ["cors"] }
ureq = { version = "=2.7.1", features = ["json"] }
serde = { version = "=1.0.197", features = ["derive"] }
serde_json = "=1.0.114"
tracing = "=0.1.40"
tracing-subscriber = { version = "=0.3.18", features = ["env-filter"] }
clap = { version = "=4.5.4", features = ["derive", "env"] }
dotenvy = "=0.15.7"
anyhow = "=1.0.81"
