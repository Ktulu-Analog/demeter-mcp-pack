[package]
name = "mcp-system"
version = "0.1.0"
edition = "2021"
description = "Serveur MCP HTTP Streamable pour l'accès au système de fichiers local — écrit en Rust"
license = "AGPL-3.0"

[[bin]]
name = "mcp-system"
path = "src/main.rs"

[dependencies]
axum = "=0.7.5"
tokio = { version = "=1.36.0", features = ["full"] }
tower-http = { version = "=0.5.2", features = ["cors"] }
serde = { version = "=1.0.197", features = ["derive"] }
serde_json = "=1.0.114"
tracing = "=0.1.40"
tracing-subscriber = { version = "=0.3.18", features = ["env-filter"] }
clap = { version = "=4.5.4", features = ["derive", "env"] }
anyhow = "=1.0.81"
walkdir = "=2.5.0"
md5 = "=0.7.0"
zip = { version = "=0.6.6", default-features = false, features = ["deflate"] }
tar = "=0.4.41"
flate2 = "=1.0.28"
bzip2 = "=0.4.4"
xz2 = "=0.1.7"
chrono = { version = "=0.4.35", features = ["serde"] }
similar = "=2.5.0"
# Pin to avoid edition2024 requirement
base64ct = "=1.6.0"
regex = "=1.10.6"
sha2 = "=0.10.8"
sha1 = "=0.10.6"
base64 = "=0.21.7"
libc = "=0.2.153"
