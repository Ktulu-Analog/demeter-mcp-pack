[package]
name = "mcp-grist"
version = "0.1.0"
edition = "2021"
description = "Serveur MCP HTTP Streamable pour l'API REST Grist (tableur collaboratif) — écrit en Rust"
license = "AGPL-3.0"

[[bin]]
name = "mcp-grist"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors"] }
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
anyhow = "1"
